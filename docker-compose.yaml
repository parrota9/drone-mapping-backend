services:
  redis:
    image: redis:latest
    container_name: drone-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  node-odm:
    image: opendronemap/nodeodm:latest
    container_name: drone-odm
    ports:
      - "3000:3000"

  minio:
    image: minio/minio:latest
    container_name: drone-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 3s
      retries: 5

  api:
    build: .
    container_name: drone-api
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - .:/app

  worker:
    build: .
    container_name: drone-worker
    command: celery -A tasks worker --loglevel=info
    env_file:
      - .env.docker
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      node-odm:
        condition: service_healthy

  db:
    image: postgres:16
    container_name: drone-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: drone_mapping
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  minio_data:
  postgres_data:
